[mkdir:basic]
; Basic DINS directory structure
; {$SRV_PATH%}
SRV_PATH = /srv/docker/services
; {$BIN_PATH%}
BIN_PATH = {$TMP_PATH%}/usr/local/bin/dins
; {$ETC_PATH%}
ETC_PATH = {$TMP_PATH%}/etc/dins
; {$VAR_PATH%}
VAR_PATH = {$TMP_PATH%}/var
; {$LOG_PATH%}
LOG_PATH = {$TMP_PATH%}/var/log/dins
; {$OPT_PATH%}
OPT_PATH = {$TMP_PATH%}/opt/dins
; {$TMP_PATH%}
TMP_PATH = {$TMP_PATH%}/tmp

[service:setup]
service = dins_setup

[mkdir:setup]
base = {$ETC_PATH%}/dins_setup
path = {$BIN_PATH%}/dins_setup

[service:config]
; services used for dins configuration
service = dins_confighandler
service = dins_avahi
service = dins_web_ui
service = dins_cli_ui

[mkdir:config]
; compose mounts and paths for confighandler
path = {$ETC_PATH%}/confighandler
path = {$LOG_PATH%}/confighandler
path = {$OPT_PATH%}/confighandler
path = {$OPT_PATH%}/confighandler/shared
path = {$OPT_PATH%}/confighandler/api
; compose mounts and paths for avahi
path = {$ETC_PATH%}/avahi
path = {$LOG_PATH%}/avahi
path = {$OPT_PATH%}/avahi/services
path = {$OPT_PATH%}/confighandler/shared/dins_avahi
; compose mounts and paths for web_ui
path = {$ETC_PATH%}/web_ui
path = {$LOG_PATH%}/web_ui
path = {$OPT_PATH%}/web_ui
path = {$OPT_PATH%}/web_ui/conf.d
path = {$OPT_PATH%}/web_ui/html
path = {$OPT_PATH%}/confighandler/shared/dins_web_ui
; compose mounts and paths for cli_ui
path = {$ETC_PATH%}/cli_ui
path = {$LOG_PATH%}/cli_ui
path = {$OPT_PATH%}/cli_ui/config
path = {$OPT_PATH%}/confighandler/shared/dins_cli_ui

[notes]
; All `base` entries are required for Docker and system operations.
; All `path` entries may be prefixed with /tmp when running in simulate mode.
; Configuration and runtime data are shared via /opt/dins/confighandler/shared/service_x.