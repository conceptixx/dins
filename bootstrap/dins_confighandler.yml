  dins_confighandler:
    image: ghcr.io/conceptixx/dins-confighandler:latest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 5s
    hostname: dins-confighandler
    networks:
      - dins_internal
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    volumes:
      - {$OPT_PATH%}/dins_confighandler/config:/app/config
      - {$OPT_PATH%}/dins_confighandler/data:/app/data
      - {$OPT_PATH%}/dins_confighandler/shared:/opt/dins/confighandler/shared
      - {$LOG_PATH%}/dins_confighandler:/var/log/confighandler
    environment:
      - DINS_ROLE=confighandler
      - LOG_LEVEL=info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped