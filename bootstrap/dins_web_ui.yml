  dins_web_ui:
    image: nginx:latest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 5s
    hostname: dins-web-ui
    networks:
      - dins_internal
      - dins_public
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - {$OPT_PATH%}/dins_web_ui/etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - {$OPT_PATH%}/dins_web_ui/html:/usr/share/nginx/html:ro
      - {$LOG_PATH%}/dins_web_ui:/var/log/nginx
    environment:
      - NGINX_HOST=dins-config.local
      - NGINX_PORT=80
      - DINS_MODE=web
      - CONFIG_HANDLER_API=http://dins-confighandler:5000
    depends_on:
      - dins_confighandler
    configs:
      - source: dins_web_ui_conf
        target: /etc/nginx/conf.d/dins-config.conf
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    secrets: []
    restart: unless-stopped

configs:
  dins_web_ui_conf:
    file: /opt/dins/dins_web_ui/etc/nginx/conf.d/dins-config.conf