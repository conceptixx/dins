version: '3.8'

# =============================================================================
# DINS Setup Service - Docker Compose Configuration
# =============================================================================
# This compose file defines the setup service for DINS
# It is deployed as part of the installation process and used by dinser setup
# =============================================================================

services:
  dins-setup:
    build:
      context: .
      dockerfile: Dockerfile.setup
    image: dins-setup:latest
    container_name: dins-setup
    hostname: dins-setup
    restart: unless-stopped
    
    # Environment variables for setup service
    environment:
      - DINS_BASE_DIR=/opt/dins
      - DINS_CONFIG_DIR=/opt/dins/config
      - DINS_LOG_DIR=/opt/dins/logs
      - DINS_MODE=setup
      - TZ=UTC
    
    # Volume mounts
    volumes:
      - /opt/dins:/opt/dins:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dins-setup-data:/data
    
    # Network configuration
    networks:
      - dins-network
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health", "||", "exit", "0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# Named volumes
volumes:
  dins-setup-data:
    driver: local

# Networks
networks:
  dins-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
