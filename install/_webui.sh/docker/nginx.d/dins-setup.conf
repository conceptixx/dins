# =============================================================================
# DINS Setup WebUI Nginx Configuration
# Location: /dins/install/_webui.sh/docker/nginx.d/dins-setup.conf
# =============================================================================
# Only serves requests to Host: dins-setup.local
# All other hosts receive 444 (connection closed without response)
# =============================================================================

# Default server - reject all requests not matching dins-setup.local
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    # Return 444 (connection closed without response)
    return 444;
}

# DINS Setup WebUI server
server {
    listen 80;
    listen [::]:80;
    
    server_name dins-setup.local;
    
    # Root directory for frontend static files
    root /opt/dins/webui/frontend;
    index index.html;
    
    # Logging
    access_log /opt/dins/logs/nginx_access.log;
    error_log /opt/dins/logs/nginx_error.log;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    
    # Main location - serve frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Frontend sections
    location /sections/ {
        alias /opt/dins/webui/frontend/sections/;
        try_files $uri $uri/ =404;
    }
    
    # Static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check endpoint (direct access)
    location = /health {
        proxy_pass http://127.0.0.1:8080/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Disable server tokens
    server_tokens off;
}
